<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#0F1419"/>
  <rect width="800" height="800" fill="url(#grid)"/>
  <!-- green mark -->
  <rect x="190" y="190" width="420" height="420" rx="96" fill="#1DB874"/>
  <text x="400" y="548" text-anchor="middle" font-family="Fraunces" font-weight="800" font-size="400" fill="#0F1419">F</text>
  <!-- small up-tick, bottom right of the mark -->
  <path d="M520 560 L560 520 L600 560" fill="none" stroke="#0F1419" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
</svg>
